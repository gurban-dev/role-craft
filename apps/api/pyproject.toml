[project]
name = "job-application-api"
version = "1.0.0"
description = "AI Job Application Automation Platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.10.1",
    "email-validator==2.2.0",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.30.0",
    "alembic==1.19.1",
    "redis==5.2.1",
    "celery[redis]==5.6.3",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "PyJWT==2.10.1",
    "cryptography==45.0.5",
    "structlog==25.4.0",
    "orjson==3.11.1",
    "openai==1.99.9",
    "playwright==1.62.0",
    "reportlab==5.0.0",
    "tenacity==9.1.2",
    "python-dateutil==2.9.0.post0",
    "psycopg[binary]==3.2.9",
    "aiosqlite==0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "pytest-cov==6.2.1",
    "httpx==0.28.1",
    "ruff==0.12.7",
    "mypy==1.17.1",
    "types-passlib==1.7.7.20250602",
    "factory-boy==3.3.3",
    "aiosqlite==0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
dev-dependencies = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "pytest-cov==6.2.1",
    "ruff==0.12.7",
    "mypy==1.17.1",
    "types-passlib==1.7.7.20250602",
    "factory-boy==3.3.3",
    "aiosqlite==0.21.0",
]
